name: golden_bridge_pay
description: "Golden Bridge Pay — portefeuille mobile de Golden Bridge Bank (Apache Fineract)."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  provider: ^6.1.5+1
  intl: ^0.20.3
  crypto: ^3.0.7
  local_auth: ^3.0.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#0A1F44"
  adaptive_icon_foreground: assets/brand/app_icon_fg.png
  web:
    generate: true
    image_path: assets/brand/app_icon.png
    background_color: "#0A1F44"
    theme_color: "#0A1F44"
